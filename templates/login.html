<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - E-Learning Toán Lớp 3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Nunito", sans-serif;
        background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .logo {
        font-size: 3rem;
        margin-bottom: 10px;
      }
      h2 {
        color: #333;
        margin: 10px 0 30px;
        font-weight: 800;
        color: #6a11cb;
      }

      .tabs {
        display: flex;
        background: #eee;
        padding: 5px;
        border-radius: 30px;
        margin-bottom: 25px;
      }
      .tab {
        flex: 1;
        padding: 10px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        color: #777;
        transition: all 0.3s;
        border: none;
        background: transparent;
      }
      .tab.active {
        background: #fff;
        color: #6a11cb;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: 600;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box; /* Fix lỗi input tràn lề */
      }
      input:focus {
        border-color: #6a11cb;
        background: #fdfaff;
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
        color: white;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.2s;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
      }

      /* Hiệu ứng ẩn hiện */
      .hidden {
        display: none;
      }
      .fade-in {
        animation: fadeIn 0.5s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .welcome-badge {
        background: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 0.9rem;
        border: 1px solid #c3e6cb;
      }
    </style>
  </head>
  <body>
    <div class="login-card fade-in">
      <div class="logo">📚</div>
      <h2>Hệ Thống E-Learning</h2>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('student')">
          Học Sinh
        </button>
        <button class="tab" onclick="switchTab('teacher')">Giáo Viên</button>
      </div>

      <div id="student-form" class="fade-in">
        <div id="step-1-check">
          <div class="form-group">
            <label>Số điện thoại phụ huynh:</label>
            <input
              type="text"
              id="s-phone"
              placeholder="Nhập SĐT (Ví dụ: 0912...)"
              onkeypress="handleEnter(event, checkPhone)"
            />
          </div>
          <button class="btn-primary" onclick="checkPhone()">
            Kiểm tra & Tiếp tục
          </button>
        </div>

        <div id="step-2-pass" class="hidden">
          <div id="welcome-msg" class="welcome-badge"></div>

          <div class="form-group">
            <label id="pass-label">Mật khẩu:</label>
            <input
              type="password"
              id="s-pass"
              placeholder="Nhập mật khẩu..."
              onkeypress="handleEnter(event, submitStudentLogin)"
            />
          </div>

          <input type="hidden" id="is-register-mode" value="false" />

          <button
            class="btn-primary"
            id="btn-student-action"
            onclick="submitStudentLogin()"
          >
            Vào Lớp Học
          </button>
          <button
            onclick="resetStudentForm()"
            style="
              background: none;
              border: none;
              color: #777;
              margin-top: 10px;
              cursor: pointer;
              text-decoration: underline;
              font-size: 0.9rem;
            "
          >
            Quay lại nhập SĐT
          </button>
        </div>
      </div>

      <div id="teacher-form" class="hidden fade-in">
        <div class="form-group">
          <label>Tên đăng nhập:</label>
          <input type="text" id="t-user" placeholder="Username" />
        </div>
        <div class="form-group">
          <label>Mật khẩu:</label>
          <input
            type="password"
            id="t-pass"
            placeholder="Password"
            onkeypress="handleEnter(event, loginTeacher)"
          />
        </div>
        <button class="btn-primary" onclick="loginTeacher()">
          Đăng Nhập GV
        </button>
      </div>
    </div>

    <script type="module" src="/static/auth.js"></script>
  </body>
</html>
