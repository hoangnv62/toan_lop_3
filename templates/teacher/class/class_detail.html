<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chi tiết lớp học</title>
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/class-detail.css" />
  </head>

  <body>
    <div class="main-container">
      <div id="sidebar-container">{% include "sidebar.html" %}</div>

      <div class="main-content">
        <h2>📘 Chi tiết lớp học</h2>

        <!-- CLASS INFO -->
        <div id="class-detail"></div>

        <!-- ADD STUDENT -->
        <div class="card">
          <h3>➕ Thêm học sinh</h3>
          <div class="form-row">
            <input id="student-name" placeholder="Tên học sinh" />
            <input id="student-dob" type="date" />
            <input id="parent-name" placeholder="Tên phụ huynh" />
            <input id="parent-phone" placeholder="SĐT phụ huynh" />
            <button id="btn-add-student">Thêm</button>
          </div>
        </div>

        <!-- STUDENT LIST -->
        <div class="card">
          <h3>👩‍🎓 Danh sách học sinh</h3>
          <table class="student-table">
            <thead>
              <tr>
                <th>Tên</th>
                <th>Phụ huynh</th>
                <th>SĐT</th>
                <th>Ngày sinh</th>
                <th>Điểm TB</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="student-table-body"></tbody>
          </table>
        </div>

        <!-- UPLOAD -->
        <div class="card">
          <h3>📤 Upload danh sách học sinh</h3>
          <input type="file" id="student-file" accept=".xlsx,.csv" />
          <button id="btn-upload">Upload</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="/static/class-detail.js"></script>
  </body>
</html>
