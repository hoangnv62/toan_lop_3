<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/common.css" />
    \
    <link rel="stylesheet" href="/static/css/lesson-detail.css" />
  </head>
  <body>
    <div class="main-container">
      <div id="sidebar-container">
        <div id="sidebar-container">{% include "sidebar.html" %}</div>
      </div>
      <div class="main-content">
        <div class="lesson-detail">
          <!-- Header -->
          <div class="lesson-header">
            <h2 id="lesson-name">📘 Tên bài học</h2>
            <button id="btn-create-exam">➕ Tạo bài thi</button>
          </div>

          <!-- Exam list -->
          <div id="exam-list" class="exam-list">
            <!-- exam items render bằng JS -->
          </div>
        </div>

        <!-- ===== Popup Exam ===== -->
        <div id="exam-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h3>📝 Thông tin bài thi</h3>
              <button id="btn-close-modal">✖</button>
            </div>

            <div class="modal-body">
              <p class="lesson-title">
                Lesson: <span id="modal-lesson-title"></span>
              </p>

              <label>Tên bài thi</label>
              <input type="text" id="exam-name" />

              <label>Mô tả bài thi</label>
              <input type="text" id="exam-description" />

              <label>Số lượng câu hỏi</label>
              <select id="question-count">
                <option value="5">5 câu</option>
                <option value="10">10 câu</option>
                <option value="15">15 câu</option>
              </select>

              <!-- Action buttons -->
              <div class="exam-actions">
                <button id="btn-generate-ai">🤖 Tạo câu hỏi với AI</button>
                <button id="btn-save-exam">💾 Lưu danh sách câu hỏi</button>
                <button id="btn-add-question">Thêm câu hỏi</button>
              </div>

              <!-- Question list -->
              <div id="question-list" class="question-list">
                <!-- render question + answers -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>AI đang tạo câu hỏi...</p>
    </div>

    <div id="toast-container"></div>
  </body>
</html>
<script type="module" src="/static/lesson-detail.js"></script>
