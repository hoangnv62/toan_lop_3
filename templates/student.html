<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Góc Học Tập Thông Minh</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../static/css/common.css" />
    <link rel="stylesheet" href="../static/css/student.css" />
  </head>
  <body>
    <div id="lesson-view" class="container">
      <div class="student-header">
        <div class="header-bar">
          <h1 class="welcome" id="welcome-msg">Chào bé yêu! 👋</h1>
          <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>
      </div>

      <!-- Tiêu đề chính nằm trên grid, cùng cấp -->
      <h2 class="main-title">📚 Bài học của bé</h2>
      <div class="calendar-card">
        <div class="card-title">📅 Tuần này</div>
        <div id="week-calendar" class="week-grid"></div>
      </div>
      <!-- Bên phải: Tiến bộ + Thành tích + Tuần này -->
      <div class="progress-section">
        <div class="card chart-card">
          <div class="card-title">📈 Tiến bộ học tập</div>
          <div style="height: 340px">
            <canvas id="progressChart"></canvas>
          </div>
        </div>
      </div>
      <div class="dashboard-grid">
        <!-- Bên trái: Chỉ danh sách bài học -->
        <div class="lessons-section">
          <div id="lessons-container" class="lessons-grid"></div>
        </div>
        <div class="card">
          <div class="card-title">🏆 Bảng xếp hạng</div>
          <div id="rank-container" class="rank-container"></div>
        </div>
      </div>
    </div>

    <div id="exam-view" class="container">
      <div class="exam-header">
        <h2 id="exam-title-display" style="margin: 0; color: #2d3748">
          Đề thi
        </h2>
        <div style="display: flex; align-items: center; gap: 1rem">
          <span
            id="timer"
            style="
              font-weight: bold;
              color: #e53e3e;
              background: #fff5f5;
              padding: 0.4rem 1rem;
              border-radius: 999px;
            "
            >00:00</span
          >
          <button
            onclick="location.reload()"
            style="
              background: #edf2f7;
              color: #4a5568;
              border: none;
              padding: 0.6rem 1rem;
              border-radius: 0.7rem;
              cursor: pointer;
              font-weight: 700;
            "
          >
            Thoát
          </button>
        </div>
      </div>

      <div id="questions-container"></div>

      <button class="btn-submit-exam" onclick="submitExam()">
        ✅ Nộp bài ngay
      </button>
    </div>
    <div id="toast-container"></div>
    <div id="score-overlay"></div>

    <script type="module" src="/static/student-functions.js"></script>
    <script type="module" src="/static/exam.js"></script>
    <script type="module" src="/static/chart.js"></script>
    <script type="module" src="/static/student/index.js"></script>
    <script type="module" src="/static/auth.js"></script>
  </body>
</html>
