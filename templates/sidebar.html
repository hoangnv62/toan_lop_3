<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/sidebar.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h2>🎓 Giáo viên Toán</h2>

      <a href="/dashboard" class="sidebar-btn"> 📊 Báo cáo & Phân tích </a>

      <a href="/manage-class" class="sidebar-btn"> 🏫 Quản lý lớp </a>

      <a href="/manage-lesson" class="sidebar-btn"> 📚 Bài học & Đề thi </a>

      <a href="/logout" class="sidebar-btn logout"> 🚪 Đăng xuất </a>
    </aside>
  </body>
</html>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentPath = window.location.pathname;
    const menuItems = document.querySelectorAll(".sidebar-btn");

    menuItems.forEach((item) => {
      const href = item.getAttribute("href");

      // Active nếu URL trùng hoặc là trang con
      if (
        currentPath === href ||
        (href !== "/" && currentPath.startsWith(href))
      ) {
        item.classList.add("active");
      }
    });
  });
</script>
